configuration:
  firmware_version:
    name: Firmware version
    description: >-
      Dual-PAN runtime version on the dongle. Only 33 is accepted; the add-on
      verifies the image hash before it opens the radio.
  ctx0_network_key:
    name: Network key — second bedroom (PAN FA9B)
    description: >-
      32 hex characters, exported once from the commissioning machine. Not
      masked: a masked field is sent for a breach check that fails closed
      where that service is unreachable. Stored as plain text by the
      Supervisor either way; never written to the add-on's own data.
  ctx1_network_key:
    name: Network key — bedroom (PAN 0B7A)
    description: >-
      32 hex characters, exported once from the commissioning machine. Not
      masked: a masked field is sent for a breach check that fails closed
      where that service is unreachable. Stored as plain text by the
      Supervisor either way; never written to the add-on's own data.
  ctx0_key_sha256:
    name: Key digest — second bedroom
    description: >-
      Verification digest printed beside the key by the export tool. Startup
      stops if the key does not match it.
  ctx1_key_sha256:
    name: Key digest — bedroom
    description: >-
      Verification digest printed beside the key by the export tool. Startup
      stops if the key does not match it.
  log_level:
    name: Log level
    description: >-
      How much the add-on logs. Keys and other secret material are excluded at
      every level.
  acknowledge_fault:
    name: Acknowledge a latched fault
    description: >-
      Leave empty. To clear a latched fault, write its reason here exactly as
      the log printed it. Faults that need someone to decide what happened
      stay latched however exactly they are named.
  survey_seconds:
    name: Placement survey (seconds)
    description: >-
      Leave at 0 to run the bridge. Any other value listens for that long and
      reports what each unit sounds like from here, transmitting nothing and
      changing nothing, then stops.
  import_staged_stores:
    name: Import staged stores (migration only)
    description: >-
      Off in normal operation. Turn it on once to bring durable stores in from
      /share/airnanny_stores, then turn it off again. Left on, a stale staged
      copy could reinstate old frame counters after the data volume is emptied.
  discovery_listen_seconds:
    name: Listen for a beacon (seconds)
    description: >-
      0 uses the standard scan, which waits a fraction of a second for the
      unit to answer. Raise it where a unit is heard clearly but never
      answers: these networks also beacon on their own every twenty seconds
      or so, and a longer listen catches one. Costs nothing but time.
