name: AirNanny Dual-PAN Bridge
version: "0.7.0"
slug: airnanny
description: Two AirNanny A7 units on separate Zigbee PANs, bridged to Home Assistant over MQTT
url: https://github.com/mrkotee/breeze_control_addon
arch:
  - aarch64

# Pulled rather than built on the target. Building there makes Supervisor
# fetch its buildx helper from Docker Hub first, which fails on hosts that
# cannot reach that registry -- before this add-on's Dockerfile is read at
# all. The image is built by this repository's workflow and published to the
# same registry Home Assistant already pulls itself from. The tag Supervisor
# requests is the version above.
image: ghcr.io/mrkotee/breeze_control_addon-{arch}

# The Home Assistant base images bring their own init.
init: false
startup: services
boot: auto

# Shared so the broker running beside us is reached on a real loopback
# address. The runtime refuses plaintext MQTT to anything else, which is the
# correct rule; this satisfies it rather than working around it.
host_network: true

# The nRF52840 dongle is identified by its pinned USB vid/pid/serial, not by a
# device path, so the whole serial class is mapped and udev is needed to read
# those attributes back.
uart: true
udev: true

# Supervisor injects host, port, username and password of the installed
# Mosquitto broker. No broker credentials are ever stored in this repository.
services:
  - mqtt:need

# An add-on's data volume is not reachable from the shares an operator can
# write to, so durable stores are staged in /share/airnanny_stores and taken
# in on startup. Read-only: the import only ever reads from here, and the
# staged copy stays as the operator arranged it until they remove it.
map:
  - type: share

# Durable security stores are deliberately excluded from Home Assistant
# backups: restoring an older backup would roll back next_fc and generation,
# which the protocol forbids. The service also fails closed if it detects a
# rollback, so this exclusion is the first of two barriers, not the only one.
backup: hot
backup_exclude:
  - "stores/**"
  - "state/**/*.private.json"

options:
  firmware_version: 33
  ctx0_network_key: ""
  ctx1_network_key: ""
  ctx0_key_sha256: ""
  ctx1_key_sha256: ""
  log_level: info
  acknowledge_fault: ""
  survey_seconds: 0

schema:
  firmware_version: "int(33,33)"
  # Not `password`, although these are secret. Supervisor sends a password
  # option to Have I Been Pwned before saving it, and where that service is
  # unreachable the save fails with an unexplained error rather than a
  # warning -- home-assistant/supervisor#6463. A regex also does what the
  # password type never did here: reject anything that is not exactly the
  # 32 hex characters a 128-bit network key is written as.
  ctx0_network_key: "match(^[0-9a-fA-F]{32}$)"
  ctx1_network_key: "match(^[0-9a-fA-F]{32}$)"
  ctx0_key_sha256: "match(^[0-9a-f]{64}$)"
  ctx1_key_sha256: "match(^[0-9a-f]{64}$)"
  log_level: "list(debug|info|warning|error)"
  # Left empty in normal operation. To clear a latched fault the operator
  # writes its reason here exactly as the log printed it, which is deliberate
  # and leaves a record. Faults that need a person to decide what happened
  # stay latched however exactly they are named.
  acknowledge_fault: "str?"
  # Non-zero runs a placement survey instead of the bridge: it listens for
  # that many seconds, reports signal strength and link quality per context,
  # and transmits nothing. Set it back to 0 to run the bridge.
  survey_seconds: "int(0,3600)"
